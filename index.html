 <!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BPL Live TV</title>
    <link href="https://vjs.zencdn.net/7.20.3/video-js.min.css" rel="stylesheet" />
    <style>
        body { background-color: #0a0a0a; color: #fff; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; }
        #main-app { display: block; padding: 15px; }
        .container { max-width: 1000px; margin: auto; }
        .header-title { text-align: center; color: #e50914; font-size: 22px; text-transform: uppercase; margin-bottom: 15px; font-weight: bold; }
        
        /* Player Design */
        .player-wrapper { position: relative; background: #000; border-radius: 8px; overflow: hidden; border: 1px solid #333; height: 450px; width: 100%; margin-bottom: 20px; }
        .video-js, #bpl-iframe { width: 100% !important; height: 100% !important; }
        #bpl-iframe { display: none; border: none; }

        /* Grid Design */
        .channel-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; padding: 10px; background: #151515; border-radius: 10px; border: 1px solid #333; max-height: 400px; overflow-y: auto; }
        .channel-item { background: #222; border-radius: 6px; padding: 12px 5px; text-align: center; cursor: pointer; transition: 0.3s; border: 1px solid #444; font-size: 13px; font-weight: bold; color: #ccc; }
        .channel-item:hover, .channel-item.active { background: #e50914; color: #fff; border-color: #fff; }

        @media (max-width: 600px) { 
            .player-wrapper { height: 250px; } 
            .channel-grid { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); }
        }
    </style>
</head>
<body>

<div id="main-app">
    <div class="container">
        <div class="header-title">Premium Live TV</div>

        <div class="player-wrapper">
            <video id="tv-player" class="video-js vjs-big-play-centered" controls preload="auto" poster="https://i.ibb.co/3pXnB9K/loading.jpg">
            </video>
            <iframe id="bpl-iframe" src="" allowfullscreen="true" scrolling="no"></iframe>
        </div>

        <div class="channel-grid" id="playlist">
            <div class="channel-item" onclick="playBPL(this)">BPL LIVE</div>
            <p style="text-align:center; width:100%;" id="loading-text">চ্যানেল লোড হচ্ছে...</p>
        </div>
    </div>
</div>

<script src="https://vjs.zencdn.net/7.20.3/video.min.js"></script>

<script>
    const m3uUrl = 'https://raw.githubusercontent.com/cctvccplc/Tv-Test/refs/heads/main/BD26.m3u8';
    const bplUrl = "https://topembed.pw/channel/bet11664644";
    let player;

    // Initialize Player
    document.addEventListener("DOMContentLoaded", function() {
        player = videojs('tv-player');
        loadPlaylist();
    });

    function playBPL(element) {
        // Active Class Switch
        document.querySelectorAll('.channel-item').forEach(el => el.classList.remove('active'));
        element.classList.add('active');

        // Switch to Iframe
        player.pause();
        document.getElementById('tv-player').style.display = 'none';
        const iframe = document.getElementById('bpl-iframe');
        iframe.src = bplUrl;
        iframe.style.display = 'block';
        window.scrollTo({top: 0, behavior: 'smooth'});
    }

    async function loadPlaylist() {
        try {
            const response = await fetch(m3uUrl);
            const data = await response.text();
            const lines = data.split('\n');
            const playlistElement = document.getElementById('playlist');
            
            // Clear but keep BPL button
            playlistElement.innerHTML = '<div class="channel-item" id="bpl-btn" onclick="playBPL(this)">BPL LIVE</div>';

            let channels = [];
            for (let i = 0; i < lines.length; i++) {
                if (lines[i].startsWith('#EXTINF:')) {
                    let name = lines[i].split(',')[1];
                    let url = lines[i + 1]?.trim();
                    if (url && url.startsWith('http')) {
                        channels.push({ name, url });
                    }
                }
            }

            channels.forEach((channel) => {
                const btn = document.createElement('div');
                btn.className = 'channel-item';
                btn.innerText = channel.name;
                btn.onclick = () => {
                    document.querySelectorAll('.channel-item').forEach(el => el.classList.remove('active'));
                    btn.classList.add('active');

                    // Switch back to VideoJS
                    document.getElementById('bpl-iframe').style.display = 'none';
                    document.getElementById('bpl-iframe').src = ""; 
                    document.getElementById('tv-player').style.display = 'block';

                    player.src({ src: channel.url, type: 'application/x-mpegURL' });
                    player.play();
                    window.scrollTo({top: 0, behavior: 'smooth'});
                };
                playlistElement.appendChild(btn);
            });

        } catch (error) {
            console.error('Playlist Load Failed:', error);
            document.getElementById('loading-text').innerText = "চ্যানেল লোড করতে সমস্যা হয়েছে।";
        }
    }
</script>

</body>
</html>
