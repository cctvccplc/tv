<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CCTV CC PLC - Premium TV</title>
    
    <link href="https://vjs.zencdn.net/7.20.3/video-js.min.css" rel="stylesheet" />
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <style>
        body { background-color: #0a0a0a; color: #fff; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; }
        
        /* লগইন স্টাইল */
        #login-section { height: 100vh; display: flex; align-items: center; justify-content: center; background: #121212; }
        .login-box { background: #1f1f1f; padding: 40px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center; width: 300px; }
        .login-box h2 { color: #e50914; margin-bottom: 20px; }
        .login-box input { width: 90%; padding: 12px; margin: 10px 0; border: none; border-radius: 5px; background: #333; color: white; }
        .login-box button { width: 100%; padding: 12px; background: #e50914; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }

        /* মেইন কন্টেন্ট স্টাইল */
        .container { max-width: 1000px; margin: 20px auto; padding: 10px; display: none; }
        .header-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .logout-btn { background: #333; color: white; padding: 8px 15px; border: none; border-radius: 5px; cursor: pointer; }
        
        .player-wrapper { position: relative; background: #000; border-radius: 12px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.8); margin-bottom: 20px; }
        .video-js { width: 100% !important; height: 450px !important; }

        /* চ্যানেল লিস্ট */
        .channel-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; max-height: 300px; overflow-y: auto; padding: 15px; background: #151515; border-radius: 10px; border: 1px solid #333; }
        .channel-item { background: #222; border-radius: 8px; padding: 15px 5px; text-align: center; cursor: pointer; transition: 0.3s; border: 1px solid #444; position: relative; }
        .channel-item:hover { background: #e50914; transform: translateY(-3px); }
        .channel-item.active { background: #e50914; border-color: #fff; }
        
        /* অ্যাডমিন প্যানেল */
        .admin-panel { display: none; background: #1f1f1f; padding: 20px; border-radius: 10px; margin-top: 20px; border: 1px dashed #e50914; }
        .admin-panel input { width: 45%; padding: 10px; margin: 5px; border-radius: 5px; border: none; }
        .del-x { position: absolute; top: 2px; right: 2px; background: black; color: white; border: none; border-radius: 50%; width: 20px; height: 20px; cursor: pointer; font-size: 10px; }

        @media (max-width: 600px) { .video-js { height: 250px !important; } .admin-panel input { width: 90%; } }
    </style>
</head>
<body>

<div id="login-section">
    <div class="login-box">
        <h2>TV LOGIN</h2>
        <input type="text" id="username" placeholder="ইউজারনেম">
        <input type="password" id="password" placeholder="পাসওয়ার্ড">
        <button onclick="login()">প্রবেশ করুন</button>
    </div>
</div>

<div class="container" id="main-container">
    <div class="header-nav">
        <div style="color: #e50914; font-weight: bold; letter-spacing: 1px;">CCTV CC PLC</div>
        <button class="logout-btn" onclick="logout()">লগআউট</button>
    </div>

    <div class="player-wrapper">
        <video id="tv-player" class="video-js vjs-big-play-centered" controls preload="auto" poster="https://i.ibb.co/3pXnB9K/loading.jpg">
            <p class="vjs-no-js">JavaScript চালু করুন।</p>
        </video>
    </div>

    <div class="channel-grid" id="playlist">
        </div>

    <div id="admin-controls" class="admin-panel">
        <h4 style="margin-top:0; color:#e50914;">অ্যাডমিন প্যানেল</h4>
        <input type="text" id="newChName" placeholder="চ্যানেলের নাম">
        <input type="text" id="newChUrl" placeholder="চ্যানেলের URL (m3u8)">
        <button onclick="addChannel()" style="width: auto; background: #28a745; margin-left: 10px;">যোগ করুন</button>
    </div>
</div>

<script src="https://vjs.zencdn.net/7.20.3/video.min.js"></script>
<script>
    // ফায়ারবেস সেটআপ
    const firebaseConfig = { databaseURL: "https://zoyphone-a08f7-default-rtdb.firebaseio.com/" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const player = videojs('tv-player');

    // লগইন ফাংশন
    function login() {
        const u = document.getElementById("username").value;
        const p = document.getElementById("password").value;

        if (u === "admin" && p === "1234") {
            localStorage.setItem("tvRole", "admin");
            checkAccess();
        } else if (u === "user" && p === "1122") {
            localStorage.setItem("tvRole", "user");
            checkAccess();
        } else {
            alert("সঠিক তথ্য দিন!");
        }
    }

    // অ্যাক্সেস চেক
    function checkAccess() {
        const role = localStorage.getItem("tvRole");
        if (role) {
            document.getElementById("login-section").style.display = "none";
            document.getElementById("main-container").style.display = "block";
            if (role === "admin") {
                document.getElementById("admin-controls").style.display = "block";
            }
            fetchChannels();
        }
    }

    // চ্যানেল যোগ করা (Admin Only)
    function addChannel() {
        const name = document.getElementById("newChName").value;
        const url = document.getElementById("newChUrl").value;
        if (name && url) {
            db.ref('channels').push({ name, url });
            document.getElementById("newChName").value = "";
            document.getElementById("newChUrl").value = "";
        }
    }

    // ডাটাবেজ থেকে চ্যানেল আনা
    function fetchChannels() {
        const role = localStorage.getItem("tvRole");
        db.ref('channels').on('value', (snap) => {
            const list = document.getElementById("playlist");
            list.innerHTML = "";
            let first = true;

            snap.forEach((child) => {
                const data = child.val();
                const key = child.key;
                
                const item = document.createElement('div');
                item.className = 'channel-item';
                item.innerHTML = `
                    ${data.name}
                    ${role === 'admin' ? `<button class="del-x" onclick="deleteCh('${key}')">X</button>` : ''}
                `;
                
                item.onclick = (e) => {
                    if(e.target.tagName !== 'BUTTON') {
                        playVideo(data.url, item);
                    }
                };

                list.appendChild(item);

                if (first) { playVideo(data.url, item); first = false; }
            });
        });
    }

    function playVideo(url, element) {
        document.querySelectorAll('.channel-item').forEach(el => el.classList.remove('active'));
        element.classList.add('active');
        player.src({ src: url, type: 'application/x-mpegURL' });
        player.play();
    }

    function deleteCh(key) {
        if(confirm("মুছে ফেলতে চান?")) db.ref('channels/' + key).remove();
    }

    function logout() {
        localStorage.clear();
        location.reload();
    }

    window.onload = checkAccess;
</script>

</body>
</html>
