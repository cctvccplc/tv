<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ccplc CcTV | Luxury Live</title>
    <link href="https://vjs.zencdn.net/7.20.3/video-js.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;700&family=Poppins:wght@300;600&display=swap" rel="stylesheet">
    <style>
        /* Black & White Premium Theme */
        body { background-color: #000; color: #fff; font-family: 'Poppins', 'Noto Sans Bengali', sans-serif; margin: 0; padding: 0; }
        
        .premium-header { background: #000; padding: 10px; text-align: center; border-bottom: 1px solid #333; position: sticky; top: 0; z-index: 3000; }
        .header-title { font-size: 20px; color: #fff; text-transform: uppercase; font-weight: 800; letter-spacing: 3px; margin: 0; }
        
        /* Time & Date Display (Bangla) */
        .live-info { background: #111; text-align: center; padding: 8px 0; border-bottom: 1px solid #222; font-size: 14px; color: #aaa; }
        #bangla-date-time { font-weight: 500; color: #fff; }

        .container { max-width: 1200px; margin: auto; padding: 0 10px; }

        /* Sticky Player Section */
        .player-container {
            position: sticky;
            top: 45px; 
            z-index: 2500;
            background: #000;
            padding: 10px 0;
        }
        .player-wrapper { 
            position: relative; 
            background: #000; 
            border-radius: 8px; 
            overflow: hidden; 
            border: 1px solid #444; 
            width: 100%; 
            aspect-ratio: 16 / 9;
            box-shadow: 0 0 20px rgba(255,255,255,0.05); 
        }
        .video-js, #bpl-iframe { width: 100% !important; height: 100% !important; border: none; }
        #bpl-iframe { display: none; }

        /* Monochrome Category Tabs */
        .category-menu {
            display: flex;
            overflow-x: auto;
            white-space: nowrap;
            gap: 8px;
            padding: 15px 5px;
            background: #000;
            position: sticky;
            top: 280px; 
            z-index: 2400;
            scrollbar-width: none;
        }
        .category-menu::-webkit-scrollbar { display: none; }

        .cat-btn {
            background: #000;
            color: #888;
            border: 1px solid #333;
            padding: 8px 18px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: 0.3s;
            text-transform: uppercase;
        }
        .cat-btn.active {
            background: #fff;
            color: #000;
            border-color: #fff;
        }

        /* Minimalist Channel Grid */
        .channel-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(105px, 1fr)); 
            gap: 10px; 
            padding: 10px 0 50px;
        }
        .channel-item { 
            background: #000; 
            border-radius: 6px; 
            padding: 15px 5px; 
            text-align: center; 
            cursor: pointer; 
            transition: 0.2s; 
            border: 1px solid #222;
        }
        .channel-item:hover { border-color: #fff; background: #0a0a0a; }
        .channel-item.active { background: #fff; border-color: #fff; }
        .channel-item.active .channel-name { color: #000; }
        
        .channel-logo-img { width: 40px; height: 40px; object-fit: contain; margin-bottom: 8px; filter: grayscale(100%); transition: 0.3s; }
        .channel-item:hover .channel-logo-img { filter: grayscale(0%); }
        .emoji-logo { font-size: 25px; margin-bottom: 8px; display: block; }
        .channel-name { font-size: 11px; font-weight: 500; color: #ccc; display: block; height: 28px; overflow: hidden; line-height: 1.2; }

        @media (max-width: 600px) {
            .player-container { top: 41px; }
            .category-menu { top: 225px; } 
            .channel-grid { grid-template-columns: repeat(3, 1fr); gap: 6px; }
            .header-title { font-size: 16px; }
        }
    </style>
</head>
<body>

<div class="premium-header">
    <div class="header-title">CCPLC CCTV PREMIUM</div>
</div>

<div class="live-info">
    📅 <span id="bangla-date-time">লোড হচ্ছে...</span>
</div>

<div class="container">
    <div class="player-container">
        <div class="player-wrapper">
            <video id="tv-player" class="video-js vjs-big-play-centered" controls preload="auto" poster="https://i.ibb.co/3pXnB9K/loading.jpg"></video>
            <iframe id="bpl-iframe" src="" allowfullscreen="true" scrolling="no"></iframe>
        </div>
    </div>

    <div class="category-menu" id="category-tabs"></div>

    <div class="channel-grid" id="channel-container">
        <p style="text-align:center; grid-column: 1/-1;">ডেটা প্রসেসিং হচ্ছে...</p>
    </div>
</div>

<script src="https://vjs.zencdn.net/7.20.3/video.min.js"></script>
<script>
    // বাংলা সংখ্যা এবং ফরম্যাট ফাংশন
    function getBanglaDateTime() {
        const now = new Date();
        const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        let datePart = now.toLocaleDateString('bn-BD', options);
        let timePart = now.toLocaleTimeString('bn-BD', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true });
        
        return `${datePart} | ${timePart}`;
    }

    function updateTime() {
        document.getElementById('bangla-date-time').innerText = getBanglaDateTime();
    }
    setInterval(updateTime, 1000);
    updateTime();

    // চ্যানেল ডাটা
    const manualChannels = [
        { name: "T-Sports", url: "https://bongoflixbd.top/r/?watch=b0aeb53ec98c74b3b1bb5f16acf8f056", logo: "📺", category: "SPORTS", isIframe: true },
        { name: "Star Sports 1", url: "https://bongoflixbd.top/r/?watch=339dcfaa4f761b545a5b815ee54a9bad", logo: "🏏", category: "SPORTS", isIframe: true },
        { name: "Max HD", url: "https://bongoflixbd.top/r/?watch=f27d3a53af8884b6b8cf2ecc4c747d84", logo: "🎬", category: "MOVIES", isIframe: true },
        { name: "Nick", url: "https://bongoflixbd.top/r/?watch=fd144f65f19df1c7adaa116c44ce2617", logo: "👶", category: "KIDS", isIframe: true }
    ];

    const mainM3u = 'https://raw.githubusercontent.com/omnixmain/OMNIX-PLAYLIST-ZONE/refs/heads/main/playlist/RoarZoneTv.m3u';
    const banglaM3u = 'https://raw.githubusercontent.com/cctvccplc/Tv-Test/refs/heads/main/BD26.m3u8';

    let allData = {};
    let player;

    document.addEventListener("DOMContentLoaded", function() {
        player = videojs('tv-player', { fluid: true });
        loadSources();
    });

    async function loadSources() {
        try {
            manualChannels.forEach(ch => addChannelToData(ch));
            const [resMain, resBangla] = await Promise.all([
                fetch(mainM3u).then(r => r.text()),
                fetch(banglaM3u).then(r => r.text())
            ]);
            parseM3U(resMain, false); 
            parseM3U(resBangla, true); 
            renderTabs();
            showCategory('SPORTS');
        } catch (error) { console.error(error); }
    }

    function addChannelToData(ch) {
        if (!allData[ch.category]) allData[ch.category] = [];
        allData[ch.category].push(ch);
    }

    function parseM3U(data, isOverrideBangla) {
        const lines = data.split('\n');
        let currentItem = null;
        const removeList = ['t sports', 'star sports 1', 'star sports 2', 'sony ten 1', 'sony ten 2', 'sony ten 3', 'sony six', 'star sports select 1', 'star sports select 2', 'euro sports'];

        for (let i = 0; i < lines.length; i++) {
            const line = lines[i].trim();
            if (line.startsWith('#EXTINF:')) {
                const name = line.split(',')[1] || "Unknown";
                const logo = line.match(/tvg-logo="([^"]+)"/)?.[1] || "";
                let group = line.match(/group-title="([^"]+)"/)?.[1] || "OTHERS";
                group = group.toUpperCase();

                if (isOverrideBangla) group = "BANGLA";
                else {
                    if (group === "BANGLA") continue;
                    if (removeList.some(item => name.toLowerCase().includes(item))) continue;
                }
                currentItem = { name, logo, category: group, isIframe: false };
            } else if (line.startsWith('http')) {
                if (currentItem) {
                    currentItem.url = line;
                    addChannelToData(currentItem);
                    currentItem = null;
                }
            }
        }
    }

    function renderTabs() {
        const tabContainer = document.getElementById('category-tabs');
        tabContainer.innerHTML = '';
        let categories = Object.keys(allData).sort();
        const priority = ["SPORTS", "BANGLA"];
        priority.reverse().forEach(p => {
            const idx = categories.indexOf(p);
            if (idx > -1) { categories.splice(idx, 1); categories.unshift(p); }
        });

        categories.forEach(cat => {
            const btn = document.createElement('button');
            btn.className = 'cat-btn';
            btn.innerText = cat;
            btn.onclick = (e) => {
                showCategory(cat);
                e.target.scrollIntoView({ behavior: 'smooth', inline: 'center' });
            };
            btn.setAttribute('data-cat', cat);
            tabContainer.appendChild(btn);
        });
    }

    function showCategory(catName) {
        document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
        document.querySelector(`[data-cat="${catName}"]`)?.classList.add('active');
        const container = document.getElementById('channel-container');
        container.innerHTML = '';
        const channels = allData[catName] || [];
        const seen = new Set();

        channels.forEach(ch => {
            if (seen.has(ch.url)) return;
            seen.add(ch.url);
            const item = document.createElement('div');
            item.className = 'channel-item';
            const logoHtml = (ch.logo && ch.logo.startsWith('http'))
                ? `<img class="channel-logo-img" src="${ch.logo}" onerror="this.outerHTML='<span class=\'emoji-logo\'>📺</span>'">`
                : `<span class="emoji-logo">${ch.logo || '📺'}</span>`;
            item.innerHTML = `${logoHtml}<span class="channel-name">${ch.name}</span>`;
            item.onclick = () => {
                playChannel(ch);
                document.querySelectorAll('.channel-item').forEach(i => i.classList.remove('active'));
                item.classList.add('active');
            };
            container.appendChild(item);
        });
    }

    function playChannel(ch) {
        const videoEl = document.querySelector('.video-js');
        const iframeEl = document.getElementById('bpl-iframe');
        if (ch.isIframe) {
            player.pause(); videoEl.style.display = 'none'; iframeEl.style.display = 'block'; iframeEl.src = ch.url;
        } else {
            iframeEl.style.display = 'none'; iframeEl.src = ""; videoEl.style.display = 'block';
            player.src({ src: ch.url, type: 'application/x-mpegURL' });
            player.play().catch(() => {});
        }
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }
</script>
</body>
</html>
