<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CCPLC CCTV | Hybrid TV</title>
    <link href="https://vjs.zencdn.net/7.20.3/video-js.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #000000;
            --surface: #0d0d0d;
            --border: rgba(255, 255, 255, 0.1);
            --primary: #ffffff;
        }

        body {
            background-color: var(--bg-dark);
            color: #fff;
            font-family: 'Hind Siliguri', sans-serif;
            margin: 0; padding: 0;
            overflow-x: hidden;
        }

        .sticky-top-area {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: var(--bg-dark);
        }

        header {
            padding: 8px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
        }

        .logo {
            font-size: 18px;
            font-weight: 700;
        }

        /* ল্যাপটপ রেজোলিউশন (1366x768) ফিক্স */
        .video-box {
            background: #000;
            position: relative;
            width: 100%;
            max-width: 850px;
            margin: 0 auto;
            aspect-ratio: 16 / 9;
            max-height: 60vh;
        }

        #vjs-player, #iframe-player {
            width: 100% !important;
            height: 100% !important;
            object-fit: contain;
        }

        .info-slider {
            background: #ffffff; 
            color: #000;
            padding: 3px 0;
            font-size: 12px;
            font-weight: 700;
            overflow: hidden;
            white-space: nowrap;
            border-bottom: 2px solid #ff0000;
        }

        .info-content {
            display: inline-block;
            animation: scroll-left 60s linear infinite;
        }

        @keyframes scroll-left {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }

        .container { 
            max-width: 1200px; 
            margin: 0 auto; 
            padding: 0 10px; 
        }

        .search-box-container { padding: 10px 0 5px 0; }
        
        #ch-search {
            width: 100%;
            padding: 10px 15px;
            background: #111;
            border: 1px solid #333;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            outline: none;
            box-sizing: border-box;
        }

        .tabs { 
            display: flex; overflow-x: auto; gap: 8px; padding: 8px 0; 
            scrollbar-width: thin;
        }

        .tab {
            background: #141414; border: 1px solid #222; color: #888;
            padding: 6px 15px; border-radius: 20px; font-size: 12px; font-weight: 700;
            cursor: pointer; white-space: nowrap; transition: 0.3s;
        }
        .tab.active { background: #fff; color: #000; border-color: #fff; }

        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); 
            gap: 10px; 
            padding: 10px 0 30px 0; 
        }

        .item {
            background: var(--surface); border: 1px solid #1a1a1a; border-radius: 8px;
            padding: 10px 5px; text-align: center;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer; transition: 0.2s;
            min-height: 100px;
        }
        
        .item:hover { border-color: #444; transform: translateY(-2px); }
        .item.active { background: #fff; }
        .item.active .ch-name { color: #000; }

        .ch-logo { width: 40px; height: 40px; object-fit: contain; margin-bottom: 5px; }
        .ch-name { font-size: 11px; font-weight: 700; color: #ccc; }

        @media (max-height: 800px) {
            .video-box { max-width: 700px; }
            header { padding: 5px 10px; }
            .logo { font-size: 14px; }
        }
    </style>
</head>
<body>

<div class="sticky-top-area">
    <header>
        <div class="logo">CCPLC <span style="font-weight: 300; opacity: 0.6;">CCTV</span></div>
    </header>
    
    <div class="video-box" id="player-container">
        <video id="vjs-player" class="video-js vjs-big-play-centered" controls preload="auto"></video>
        <iframe id="iframe-player" style="display:none; width:100%; height:100%; border:none;" allowfullscreen></iframe>
    </div>

    <div class="info-slider">
        <div class="info-content" id="sliding-info">তথ্য লোড হচ্ছে...</div>
    </div>
</div>

<div class="container">
    <div class="search-box-container">
        <input type="text" id="ch-search" placeholder="সার্চ করুন..." onkeyup="filterChannels()">
    </div>
    <div class="tabs" id="tabs-list"></div>
    <div class="grid" id="grid-list">অপেক্ষা করুন...</div>
</div>

<script src="https://vjs.zencdn.net/7.20.3/video.min.js"></script>
<script>
    let tvPlayer = null;
    let masterData = {};
    let currentRandomQuote = "";
    let lastActiveCategory = "";

    const M3U_URL = 'https://ashtv.com.bd/server/iptv.m3u?v=1786248606692';

    function pickRandomQuote() {
        currentRandomQuote = "সাফল্য তাদেরই জন্য যারা শেষ পর্যন্ত লড়াই করে।";
    }

    function updateSlidingInfo() {
        const now = new Date();
        const dateStr = now.toLocaleDateString('bn-BD', { day: 'numeric', month: 'long', year: 'numeric' });
        const timeStr = now.toLocaleTimeString('bn-BD');
        const fullText = `📅 আজ ${dateStr} | 🕒 সময়: ${timeStr} | 💡 ${currentRandomQuote}`;
        document.getElementById('sliding-info').innerHTML = `${fullText} &nbsp;&nbsp;&nbsp;&nbsp; [ ${fullText} ]`;
    }

    setInterval(updateSlidingInfo, 1000);

    window.onload = async () => {
        pickRandomQuote();
        tvPlayer = videojs('vjs-player', { responsive: true, fluid: true });
        await loadPlaylist();
    };

    async function loadPlaylist() {
        try {
            const res = await fetch(M3U_URL);
            const data = await res.text();
            parseM3U(data);
            renderTabs();
        } catch(e) {
            document.getElementById('grid-list').innerText = "প্লেলিস্ট লোড করতে ব্যর্থ হয়েছে।";
        }
    }

    function parseM3U(data) {
        const lines = data.split('\n');
        let temp = null;
        lines.forEach(l => {
            if (l.includes('#EXTINF:')) {
                temp = { 
                    name: l.split(',')[1]?.trim() || "অজানা চ্যানেল", 
                    logo: l.match(/tvg-logo="([^"]+)"/)?.[1] || "", 
                    category: l.match(/group-title="([^"]+)"/)?.[1]?.toUpperCase() || "OTHERS" 
                };
            } else if (l.startsWith('http') && temp) {
                temp.url = l.trim();
                temp.isIframe = temp.url.includes('bongoflix');
                addChannel(temp.category, temp);
                temp = null;
            }
        });
    }

    function addChannel(cat, ch) {
        if (!masterData[cat]) masterData[cat] = [];
        masterData[cat].push(ch);
    }

    function renderTabs() {
        const cats = Object.keys(masterData).sort();
        document.getElementById('tabs-list').innerHTML = cats.map(c => `<button class="tab" onclick="loadCategory('${c}')" id="tab-${c}">${c}</button>`).join('');
        if (cats.length > 0) loadCategory(cats.includes('SPORTS') ? 'SPORTS' : cats[0]);
    }

    function loadCategory(cat) {
        lastActiveCategory = cat;
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        const activeTab = document.getElementById(`tab-${cat}`);
        if(activeTab) activeTab.classList.add('active');
        renderGrid(masterData[cat] || []);
    }

    function renderGrid(list) {
        const grid = document.getElementById('grid-list');
        if (list.length === 0) {
            grid.innerHTML = "কোনো চ্যানেল পাওয়া যায়নি।";
            return;
        }
        grid.innerHTML = list.map(ch => {
            let img = (ch.logo && ch.logo.startsWith('http')) ? `<img class="ch-logo" src="${ch.logo}">` : `<span style="font-size:20px">📺</span>`;
            return `<div class="item" onclick='playChannel(${JSON.stringify(ch)}, this)'>${img}<div class="ch-name">${ch.name}</div></div>`;
        }).join('');
    }

    function filterChannels() {
        const query = document.getElementById('ch-search').value.toLowerCase();
        if (query === "") {
            renderGrid(masterData[lastActiveCategory] || []);
        } else {
            let filtered = [];
            Object.keys(masterData).forEach(cat => {
                masterData[cat].forEach(ch => {
                    if (ch.name.toLowerCase().includes(query)) filtered.push(ch);
                });
            });
            renderGrid(filtered);
        }
    }

    function playChannel(ch, el) {
        document.querySelectorAll('.item').forEach(i => i.classList.remove('active'));
        el.classList.add('active');
        
        const v = document.getElementById('vjs-player');
        const f = document.getElementById('iframe-player');

        if (ch.isIframe) { 
            if(tvPlayer && tvPlayer.pause) tvPlayer.pause(); 
            v.parentElement.style.display = 'none';
            f.style.display = 'block'; 
            f.src = ch.url; 
        } else { 
            f.style.display = 'none'; 
            v.parentElement.style.display = 'block'; 
            tvPlayer.src({ src: ch.url, type: 'application/x-mpegURL' }); 
            tvPlayer.play(); 
        }
    }
</script>
</body>
</html>
