<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CCTV CC PLC - Secure TV</title>
    
    <link href="https://vjs.zencdn.net/7.20.3/video-js.min.css" rel="stylesheet" />
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <style>
        /* লগইন না করা পর্যন্ত পুরো বডি ফিক্সড থাকবে যাতে স্ক্রল না হয় */
        body.logged-out { overflow: hidden; height: 100vh; background-color: #121212; }
        body.logged-in { overflow: auto; background-color: #0a0a0a; }
        
        body { color: #fff; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; }
        
        /* লগইন ওভারলে - এটি পুরো স্ক্রিন জুড়ে থাকবে */
        #login-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #121212; display: flex; align-items: center; justify-content: center;
            z-index: 9999;
        }
        
        .login-box { 
            background: #1f1f1f; padding: 40px; border-radius: 15px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center; width: 320px; 
        }
        .login-box h2 { color: #e50914; margin-bottom: 20px; font-size: 24px; }
        .login-box input { 
            width: 90%; padding: 12px; margin: 10px 0; border: none; 
            border-radius: 5px; background: #333; color: white; outline: none;
        }
        .login-box button { 
            width: 100%; padding: 12px; background: #e50914; color: white; 
            border: none; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 10px;
        }

        /* টিভি কন্টেন্ট - শুরুতে এটি সম্পূর্ণ গায়েব থাকবে */
        #main-app { display: none; padding: 20px; }
        .container { max-width: 1000px; margin: auto; }
        
        .header-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .player-wrapper { background: #000; border-radius: 12px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.8); margin-bottom: 20px; }
        .video-js { width: 100% !important; height: 450px !important; }

        .channel-grid { 
            display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); 
            gap: 12px; max-height: 300px; overflow-y: auto; padding: 15px; 
            background: #151515; border-radius: 10px; border: 1px solid #333; 
        }
        .channel-item { 
            background: #222; border-radius: 8px; padding: 15px 5px; 
            text-align: center; cursor: pointer; transition: 0.3s; border: 1px solid #444; position: relative;
        }
        .channel-item.active { background: #e50914; border-color: #fff; }
        
        .admin-panel { 
            display: none; background: #1f1f1f; padding: 20px; border-radius: 10px; 
            margin-top: 20px; border: 1px dashed #e50914; 
        }
        .del-x { position: absolute; top: 2px; right: 2px; background: #000; color: #fff; border: none; border-radius: 50%; cursor: pointer; }

        @media (max-width: 600px) { .video-js { height: 250px !important; } }
    </style>
</head>
<body class="logged-out">

<div id="login-overlay">
    <div class="login-box">
        <h2>CCTV CC PLC</h2>
        <p style="color: #888; font-size: 14px;">অ্যাক্সেস করতে লগইন করুন</p>
        <input type="text" id="username" placeholder="ইউজারনেম">
        <input type="password" id="password" placeholder="পাসওয়ার্ড">
        <button onclick="login()">Login</button>
    </div>
</div>

<div id="main-app">
    <div class="container">
        <div class="header-nav">
            <div style="color: #e50914; font-weight: bold; font-size: 20px;">PREMIUM TV</div>
            <button onclick="logout()" style="background:#333; color:white; border:none; padding:8px 15px; border-radius:5px; cursor:pointer;">Logout</button>
        </div>

        <div class="player-wrapper">
            <video id="tv-player" class="video-js vjs-big-play-centered" controls preload="auto">
                <p class="vjs-no-js">To view this video please enable JavaScript.</p>
            </video>
        </div>

        <div class="channel-grid" id="playlist"></div>

        <div id="admin-controls" class="admin-panel">
            <h4 style="margin:0 0 10px 0; color:#e50914;">Owner Dashboard</h4>
            <input type="text" id="newChName" placeholder="চ্যানেলের নাম" style="padding:10px; width:40%; margin-right:5px;">
            <input type="text" id="newChUrl" placeholder="লিঙ্ক (m3u8)" style="padding:10px; width:40%;">
            <button onclick="addChannel()" style="background:#28a745; color:white; border:none; padding:10px 20px; border-radius:5px; cursor:pointer;">Add</button>
        </div>
    </div>
</div>

<script src="https://vjs.zencdn.net/7.20.3/video.min.js"></script>
<script>
    const firebaseConfig = { databaseURL: "https://zoyphone-a08f7-default-rtdb.firebaseio.com/" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    let player;

    function login() {
        const u = document.getElementById("username").value;
        const p = document.getElementById("password").value;

        if (u === "admin" && p === "1234") {
            localStorage.setItem("tvAccess", "admin");
            initApp();
        } else if (u === "user" && p === "1122") {
            localStorage.setItem("tvAccess", "user");
            initApp();
        } else {
            alert("ভুল ইউজারনেম বা পাসওয়ার্ড!");
        }
    }

    function initApp() {
        const role = localStorage.getItem("tvAccess");
        if (role) {
            // লগইন সাকসেস হলে ইন্টারফেস বদলে যাবে
            document.body.classList.remove("logged-out");
            document.body.classList.add("logged-in");
            document.getElementById("login-overlay").style.display = "none";
            document.getElementById("main-app").style.display = "block";

            if (role === "admin") {
                document.getElementById("admin-controls").style.display = "block";
            }

            if (!player) {
                player = videojs('tv-player');
            }
            fetchChannels();
        }
    }

    function fetchChannels() {
        const role = localStorage.getItem("tvAccess");
        db.ref('channels').on('value', (snap) => {
            const list = document.getElementById("playlist");
            list.innerHTML = "";
            let isFirst = true;

            snap.forEach((child) => {
                const data = child.val();
                const key = child.key;
                const item = document.createElement('div');
                item.className = 'channel-item';
                item.innerHTML = `<b>${data.name}</b> ${role === 'admin' ? `<button class="del-x" onclick="deleteCh('${key}')">X</button>` : ''}`;
                
                item.onclick = (e) => { if(e.target.tagName !== 'BUTTON') play(data.url, item); };
                list.appendChild(item);
                if (isFirst) { play(data.url, item); isFirst = false; }
            });
        });
    }

    function play(url, el) {
        document.querySelectorAll('.channel-item').forEach(item => item.classList.remove('active'));
        el.classList.add('active');
        player.src({ src: url, type: 'application/x-mpegURL' });
        player.play();
    }

    function addChannel() {
        const name = document.getElementById("newChName").value;
        const url = document.getElementById("newChUrl").value;
        if(name && url) db.ref('channels').push({ name, url });
    }

    function deleteCh(key) { if(confirm("Delete?")) db.ref('channels/' + key).remove(); }

    function logout() {
        localStorage.clear();
        location.reload();
    }

    // পেজ লোড হওয়ার সময় চেক করবে আগে থেকে লগইন আছে কি না
    window.onload = initApp;
</script>

</body>
</html>
