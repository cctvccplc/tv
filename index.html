<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CCPLC CCTV | Hybrid TV</title>
    <link href="https://vjs.zencdn.net/7.20.3/video-js.min.css" rel="stylesheet" />

    <style>
        :root {
            --bg-dark: #000000;
            --surface: #0d0d0d;
            --border: rgba(255, 255, 255, 0.1);
        }

        body {
            background-color: var(--bg-dark);
            color: #fff;
            font-family: 'Hind Siliguri', sans-serif;
            margin: 0; padding: 0;
            overflow-x: hidden;
        }

        .sticky-top-area {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: var(--bg-dark);
        }

        header {
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
        }
        .logo { font-size: 18px; font-weight: 800; color: #fff; }

        .server-switcher {
            display: flex; gap: 5px; background: #111; padding: 3px; border-radius: 50px;
        }
        .srv-btn {
            background: transparent; color: #666; border: none; padding: 5px 12px;
            border-radius: 50px; font-size: 11px; font-weight: 700; cursor: pointer;
        }
        .srv-btn.active { background: #fff; color: #000; }

        .info-slider {
            background: #ffffff; 
            color: #000;
            padding: 8px 0;
            font-size: 14px;
            font-weight: 700;
            overflow: hidden;
            white-space: nowrap;
            border-bottom: 3px solid #ff0000;
        }
        .info-content {
            display: inline-block;
            animation: scroll-left 65s linear infinite;
            padding-left: 100%;
        }
        @keyframes scroll-left {
            0% { transform: translateX(0); }
            100% { transform: translateX(-100%); }
        }

        .video-box {
            background: #000;
            aspect-ratio: 16/9;
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
        }

        .container { max-width: 1400px; margin: 0 auto; padding: 0 10px; }

        /* সার্চ বক্স স্টাইল */
        .search-box-container {
            padding: 10px 0;
        }
        #ch-search {
            width: 100%;
            padding: 10px 15px;
            background: #111;
            border: 1px solid #222;
            border-radius: 6px;
            color: #fff;
            font-family: 'Hind Siliguri', sans-serif;
            font-size: 14px;
            outline: none;
            box-sizing: border-box;
        }
        #ch-search:focus { border-color: #444; }

        .tabs { 
            display: flex; overflow-x: auto; gap: 8px; padding: 10px 0; 
            scrollbar-width: none; background: var(--bg-dark);
        }
        .tab {
            background: #141414; border: 1px solid #222; color: #888;
            padding: 8px 18px; border-radius: 4px; font-size: 11px; font-weight: 700;
            cursor: pointer; white-space: nowrap;
        }
        .tab.active { background: #fff; color: #000; border-color: #fff; }

        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding-bottom: 40px; margin-top: 10px; }
        .item {
            background: var(--surface); border: 1px solid #1a1a1a; border-radius: 8px;
            padding: 10px 5px; text-align: center; height: 95px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer;
        }
        .item.active { background: #fff; }
        .item.active .ch-name { color: #000; }
        .ch-name { font-size: 10px; font-weight: 700; color: #ccc; margin-top: 5px; }
        .ch-logo { width: 35px; height: 35px; object-fit: contain; }
    </style>
</head>

        masterData = {}; 
        if (tvPlayer && tvPlayer.dispose) { try{ tvPlayer.dispose(); } catch(e){} }
        const pContainer = document.getElementById('player-container');
        pContainer.innerHTML = '';

        if (id === 1) {
            pContainer.innerHTML = `<video id="shaka-player" controls autoplay style="width:100%; height:100%;"></video>`;
            tvPlayer = new shaka.Player(document.getElementById('shaka-player'));
            await loadM3U(M3U_DISH);
        } else {
            manualChannels.forEach(ch => addChannel(ch.category, ch));
            pContainer.innerHTML = `<video id="vjs-player" class="video-js vjs-big-play-centered" controls style="width:100%; height:100%;"></video><iframe id="iframe-player" style="display:none; width:100%; height:100%; border:none;" allowfullscreen></iframe>`;
            tvPlayer = videojs('vjs-player', { fluid: true });
            await loadServer2();
        }
    }

    async function loadM3U(url) {
        try {
            const res = await fetch(url);
            const text = await res.text();
            const lines = text.split('\n');
            let currentDRM = null;
            for (let i = 0; i < lines.length; i++) {
                let line = lines[i].trim();
                if (line.includes('license_key=')) {
                    let p = line.split('=')[1].split(':');
                    currentDRM = { [p[0].trim()]: p[1].trim() };
                } else if (line.startsWith('#EXTINF:')) {
                    let name = line.split(',')[1]?.trim() || "";
                    if (excludeKeywords.some(k => name.toLowerCase().includes(k))) continue;
                    let logo = line.match(/tvg-logo="([^"]+)"/)?.[1] || "";
                    let group = line.match(/group-title="([^"]+)"/)?.[1]?.toUpperCase() || "OTHERS";
                    let chUrl = lines[i+1]?.trim();
                    if (chUrl && chUrl.startsWith('http')) {
                        addChannel(group, { name, logo, url: chUrl, drm: currentDRM });
                    }
                    currentDRM = null;
                }
            }
            renderTabs();
        } catch(e) {}
    }

    async function loadServer2() {
        try {
            const [r1, r2] = await Promise.all([
                fetch(M3U_MAIN).then(r=>r.text()).catch(()=>""), 
                fetch(M3U_BD).then(r=>r.text()).catch(()=>"")
            ]);
            parseS2(r1, false); parseS2(r2, true);
            renderTabs();
        } catch(e) {}
    }

    function parseS2(data, isBd) {
        const lines = data.split('\n');
        let temp = null;
        lines.forEach(l => {
            if (l.includes('#EXTINF:')) {
                let name = l.split(',')[1]?.trim() || "";
                if (!isBd && excludeKeywords.some(k => name.toLowerCase().includes(k))) { temp = null; return; }
                temp = { name, logo: l.match(/tvg-logo="([^"]+)"/)?.[1], category: isBd ? "BANGLA" : (l.match(/group-title="([^"]+)"/)?.[1]?.toUpperCase() || "OTHERS") };
            } else if (l.startsWith('http') && temp) {
                temp.url = l.trim();
                temp.isIframe = temp.url.includes('bongoflix');
                addChannel(temp.category, temp);
                temp = null;
            }
        });
    }

    function addChannel(cat, ch) {
        if (!masterData[cat]) masterData[cat] = [];
        masterData[cat].push(ch);
    }

    function renderTabs() {
        const cats = Object.keys(masterData).sort();
        document.getElementById('tabs-list').innerHTML = cats.map(c => `<button class="tab" onclick="loadCategory('${c}')" id="tab-${c}">${c}</button>`).join('');
        if (cats.length > 0) loadCategory(cats.includes('SPORTS') ? 'SPORTS' : cats[0]);
    }

    function loadCategory(cat) {
        lastActiveCategory = cat;
        document.getElementById('ch-search').value = "";
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        const activeTab = document.getElementById(`tab-${cat}`);
        if(activeTab) activeTab.classList.add('active');
        
        renderGrid(masterData[cat] || []);
    }

    // গ্রিড রেন্ডার করার জন্য কমন ফাংশন
    function renderGrid(list) {
        const grid = document.getElementById('grid-list');
        grid.innerHTML = list.map(ch => {
            let img = (ch.logo && ch.logo.startsWith('http')) ? `<img class="ch-logo" src="${ch.logo}">` : `📺`;
            return `<div class="item" onclick='playChannel(${JSON.stringify(ch)}, this)'>${img}<div class="ch-name">${ch.name}</div></div>`;
        }).join('');
    }

    // সার্চ ফিল্টার ফাংশন
    function filterChannels() {
        const query = document.getElementById('ch-search').value.toLowerCase();
        if (query === "") {
            renderGrid(masterData[lastActiveCategory] || []);
        } else {
            let filtered = [];
            Object.keys(masterData).forEach(cat => {
                masterData[cat].forEach(ch => {
                    if (ch.name.toLowerCase().includes(query)) {
                        filtered.push(ch);
                    }
                });
            });
            renderGrid(filtered);
        }
    }

    function playChannel(ch, el) {
        document.querySelectorAll('.item').forEach(i => i.classList.remove('active'));
        el.classList.add('active');
        if (currentServer === 1) {
            tvPlayer.configure({ drm: { clearKeys: ch.drm || {} } });
            tvPlayer.load(ch.url);
        } else {
            const v = document.getElementById('vjs-player'), f = document.getElementById('iframe-player');
            if (ch.isIframe) { 
                if(tvPlayer && tvPlayer.pause) tvPlayer.pause(); 
                v.style.display = 'none'; f.style.display = 'block'; f.src = ch.url; 
            } else { 
                f.style.display = 'none'; v.style.display = 'block'; 
                tvPlayer.src({ src: ch.url, type: 'application/x-mpegURL' }); 
                tvPlayer.play(); 
            }
        }
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }
</script>
