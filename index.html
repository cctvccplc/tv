<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CCPLC CCTV | Hybrid TV</title>
    <link href="https://vjs.zencdn.net/7.20.3/video-js.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #08090b;
            --surface: #101317;
            --surface-2: #171b21;
            --border: rgba(255, 255, 255, 0.08);
            --border-strong: rgba(255, 255, 255, 0.16);
            --text: #eef1f4;
            --text-dim: #7c8591;
            --text-faint: #4b525c;
            --accent: #e8384f;      /* tally / rec light */
            --accent-dim: #7a1f29;
            --live: #35c9a5;        /* status / live */
            --amber: #e8a13b;       /* secondary accent, used sparingly */
            --mono: 'JetBrains Mono', monospace;
            --sans: 'Hind Siliguri', sans-serif;
        }

        * { box-sizing: border-box; }

        body {
            background-color: var(--bg);
            background-image:
                radial-gradient(circle at 15% 0%, rgba(232,56,79,0.06), transparent 40%),
                radial-gradient(circle at 85% 10%, rgba(53,201,165,0.05), transparent 35%);
            color: var(--text);
            font-family: var(--sans);
            margin: 0; padding: 0;
            overflow-x: hidden;
        }

        ::selection { background: var(--accent); color: #fff; }

        /* ---------- Header ---------- */
        .sticky-top-area {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: var(--bg);
        }

        header {
            padding: 10px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
        }

        .logo-block { display: flex; align-items: center; gap: 10px; }

        .logo {
            font-family: var(--mono);
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: var(--text);
        }
        .logo span.tag {
            font-weight: 500;
            color: var(--text-dim);
            font-size: 11px;
            letter-spacing: 2px;
            margin-left: 6px;
            border: 1px solid var(--border-strong);
            padding: 2px 6px;
            border-radius: 3px;
        }

        .powered-by {
            display: flex; align-items: center; gap: 6px;
            font-family: var(--mono);
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 0.5px;
            color: var(--text-faint);
            border: 1px solid var(--border-strong);
            padding: 4px 10px;
            border-radius: 20px;
            background: var(--surface);
        }
        .powered-by .pb-label {
            color: var(--text-faint);
        }
        .powered-by .pb-brand {
            color: var(--amber);
            font-weight: 700;
            letter-spacing: 0.8px;
        }

        /* ---------- Video ---------- */
        .video-box {
            background: #000;
            position: relative;
            width: 100%;
            max-width: 850px;
            margin: 10px auto 0 auto;
            aspect-ratio: 16 / 9;
            max-height: 60vh;
            border: 1px solid var(--border-strong);
            border-radius: 2px;
            overflow: hidden;
        }

        /* viewfinder corner brackets — decorative, non-interactive */
        .frame-corner {
            position: absolute;
            width: 16px; height: 16px;
            border: 2px solid var(--accent);
            opacity: 0.85;
            pointer-events: none;
            z-index: 5;
        }
        .fc-tl { top: 6px; left: 6px; border-right: none; border-bottom: none; }
        .fc-tr { top: 6px; right: 6px; border-left: none; border-bottom: none; }
        .fc-bl { bottom: 6px; left: 6px; border-right: none; border-top: none; }
        .fc-br { bottom: 6px; right: 6px; border-left: none; border-top: none; }

        #vjs-player, #iframe-player {
            width: 100% !important;
            height: 100% !important;
            object-fit: contain;
        }

        /* ---------- Ticker ---------- */
        .info-slider {
            background: #0c0d0f;
            color: var(--live);
            padding: 4px 0;
            font-family: var(--mono);
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.3px;
            overflow: hidden;
            white-space: nowrap;
            border-bottom: 1px solid var(--border);
            border-top: 1px solid #000;
        }

        .info-content {
            display: inline-block;
            animation: scroll-left 60s linear infinite;
        }

        @keyframes scroll-left {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }

        /* ---------- Layout ---------- */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 12px;
        }

        .search-box-container { padding: 14px 0 8px 0; position: relative; }

        .search-icon {
            position: absolute;
            left: 14px; top: 24px;
            color: var(--text-faint);
            font-family: var(--mono);
            font-size: 13px;
            pointer-events: none;
        }

        #ch-search {
            width: 100%;
            padding: 11px 15px 11px 34px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            font-family: var(--sans);
            font-size: 14px;
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }
        #ch-search::placeholder { color: var(--text-faint); }
        #ch-search:focus { border-color: var(--accent-dim); }

        /* ---------- Tabs (channel presets) ---------- */
        .tabs {
            display: flex; overflow-x: auto; gap: 4px; padding: 12px 0 10px 0;
            scrollbar-width: thin;
            border-bottom: 1px solid var(--border);
        }

        .tab {
            background: transparent;
            border: none;
            border-bottom: 2px solid transparent;
            color: var(--text-dim);
            padding: 6px 14px 10px 14px;
            font-family: var(--mono);
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1px;
            cursor: pointer;
            white-space: nowrap;
            transition: color 0.2s, border-color 0.2s;
        }
        .tab:hover { color: var(--text); }
        .tab.active { color: var(--text); border-bottom-color: var(--accent); }

        /* ---------- Grid ---------- */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(104px, 1fr));
            gap: 10px;
            padding: 14px 0 32px 0;
        }

        .item {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 12px 6px 10px 6px;
            text-align: center;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 8px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: border-color 0.2s, background 0.2s, transform 0.15s;
            min-height: 104px;
        }

        .item::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, transparent 0%, rgba(255,255,255,0.03) 50%, transparent 100%);
            transform: translateY(-100%);
            transition: transform 0.4s;
            pointer-events: none;
        }
        .item:hover::before { transform: translateY(100%); }

        .item:hover { border-color: var(--border-strong); transform: translateY(-2px); }
        .item.active { background: var(--text); border-color: var(--text); }
        .item.active .ch-name { color: #000; }
        .item.active .ch-logo-fallback { color: #000; }

        .ch-logo { width: 38px; height: 38px; object-fit: contain; }
        .ch-logo-fallback {
            width: 38px; height: 38px;
            display: flex; align-items: center; justify-content: center;
            font-family: var(--mono);
            font-size: 15px;
            color: var(--text-faint);
            border: 1px solid var(--border-strong);
            border-radius: 4px;
        }
        .ch-name {
            font-size: 11px;
            font-weight: 600;
            color: #ccc;
            line-height: 1.3;
        }

        @media (max-height: 800px) {
            .video-box { max-width: 700px; }
            header { padding: 6px 12px; }
        }

        @media (max-width: 420px) {
            .logo span.tag { display: none; }
        }
    </style>
</head>

        "যে সময় নষ্ট করে, সে জীবন নষ্ট করে।",
        "নিজের কাজে মনোযোগী হও, ফলাফল আপনাআপনি আসবে।",
        "সাহসী মানুষেরা কখনো হার মানে না।",
        "যে অন্যকে সম্মান করে, সে সম্মান পায়।",
        "প্রতিটি দিন শেখার একটি নতুন সুযোগ।",
        "মনোবল শক্ত থাকলে কোনো বাধাই বড় নয়।",
        "যে নিজের কথা রাখে, সে বিশ্বাসযোগ্য হয়।",
        "কঠিন পথই সবচেয়ে সুন্দর গন্তব্যে নিয়ে যায়।",
        "নিজের সামর্থ্যে বিশ্বাস রাখো।",
        "যে হাল ছাড়ে না, ভাগ্য তার সহায় হয়।",
        "প্রতিটি অভিজ্ঞতাই একটি মূল্যবান শিক্ষা।",
        "মানুষ তার কর্মেই বিচার্য, কথায় নয়।",
        "যে নিজের ভুল থেকে শেখে না, সে বারবার হোঁচট খায়।",
        "সাফল্য একদিনে আসে না, এটি ধারাবাহিক প্রচেষ্টার ফল।"
    ];

    function pickRandomQuote() {
        currentRandomQuote = QUOTES[Math.floor(Math.random() * QUOTES.length)];
    }

    function updateSlidingInfo() {
        const now = new Date();
        const dateStr = now.toLocaleDateString('bn-BD', { day: 'numeric', month: 'long', year: 'numeric' });
        const timeStr = now.toLocaleTimeString('bn-BD');
        const fullText = `📅 আজ ${dateStr} | 🕒 সময়: ${timeStr} | 💡 ${currentRandomQuote}`;
        document.getElementById('sliding-info').innerHTML = `${fullText} &nbsp;&nbsp;&nbsp;&nbsp; [ ${fullText} ]`;
    }

    setInterval(updateSlidingInfo, 1000);
    setInterval(pickRandomQuote, 30000); // প্রতি ৩০ সেকেন্ডে নতুন quote

    window.onload = async () => {
        pickRandomQuote();
        tvPlayer = videojs('vjs-player', { responsive: true, fluid: true });
        await loadPlaylist();
    };

    async function loadPlaylist() {
        try {
            const res = await fetch(M3U_URL);
            const data = await res.text();
            parseM3U(data);
            renderTabs();
        } catch(e) {
            document.getElementById('grid-list').innerText = "প্লেলিস্ট লোড করতে ব্যর্থ হয়েছে।";
        }
    }

    function parseM3U(data) {
        const lines = data.split('\n');
        let temp = null;
        lines.forEach(l => {
            if (l.includes('#EXTINF:')) {
                temp = { 
                    name: l.split(',')[1]?.trim() || "অজানা চ্যানেল", 
                    logo: l.match(/tvg-logo="([^"]+)"/)?.[1] || "", 
                    category: l.match(/group-title="([^"]+)"/)?.[1]?.toUpperCase() || "OTHERS" 
                };
            } else if (l.startsWith('http') && temp) {
                temp.url = l.trim();
                temp.isIframe = temp.url.includes('bongoflix');
                addChannel(temp.category, temp);
                temp = null;
            }
        });
    }

    function addChannel(cat, ch) {
        if (!masterData[cat]) masterData[cat] = [];
        masterData[cat].push(ch);
    }

    function renderTabs() {
        const cats = Object.keys(masterData).sort();
        document.getElementById('tabs-list').innerHTML = cats.map(c => `<button class="tab" onclick="loadCategory('${c}')" id="tab-${c}">${c}</button>`).join('');
        if (cats.length > 0) loadCategory(cats.includes('SPORTS') ? 'SPORTS' : cats[0]);
    }

    function loadCategory(cat) {
        lastActiveCategory = cat;
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        const activeTab = document.getElementById(`tab-${cat}`);
        if(activeTab) activeTab.classList.add('active');
        renderGrid(masterData[cat] || []);
    }

    function renderGrid(list) {
        const grid = document.getElementById('grid-list');
        if (list.length === 0) {
            grid.innerHTML = "কোনো চ্যানেল পাওয়া যায়নি।";
            return;
        }
        grid.innerHTML = list.map(ch => {
            let img = (ch.logo && ch.logo.startsWith('http')) ? `<img class="ch-logo" src="${ch.logo}">` : `<span class="ch-logo-fallback">📺</span>`;
            return `<div class="item" onclick='playChannel(${JSON.stringify(ch)}, this)'>${img}<div class="ch-name">${ch.name}</div></div>`;
        }).join('');
    }

    function filterChannels() {
        const query = document.getElementById('ch-search').value.toLowerCase();
        if (query === "") {
            renderGrid(masterData[lastActiveCategory] || []);
        } else {
            let filtered = [];
            Object.keys(masterData).forEach(cat => {
                masterData[cat].forEach(ch => {
                    if (ch.name.toLowerCase().includes(query)) filtered.push(ch);
                });
            });
            renderGrid(filtered);
        }
    }

    function playChannel(ch, el) {
        document.querySelectorAll('.item').forEach(i => i.classList.remove('active'));
        el.classList.add('active');
        
        const v = document.getElementById('vjs-player');
        const f = document.getElementById('iframe-player');

        if (ch.isIframe) { 
            if(tvPlayer && tvPlayer.pause) tvPlayer.pause(); 
            v.parentElement.style.display = 'none';
            f.style.display = 'block'; 
            f.src = ch.url; 
        } else { 
            f.style.display = 'none'; 
            v.parentElement.style.display = 'block'; 
            tvPlayer.src({ src: ch.url, type: 'application/x-mpegURL' }); 
            tvPlayer.play(); 
        }
    }
</script>
</body>
</html>
