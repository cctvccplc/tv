<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CCPLC CCTV | Hybrid TV</title>
    <link href="https://vjs.zencdn.net/7.20.3/video-js.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/shaka-player.compiled.js"></script>
    <style>
        :root {
            --bg-dark: #000000;
            --surface: #0d0d0d;
            --border: rgba(255, 255, 255, 0.1);
        }
        body {
            background-color: var(--bg-dark);
            color: #fff;
            font-family: 'Hind Siliguri', sans-serif;
            margin: 0; padding: 0;
            overflow-x: hidden;
            /* TV ও মোবাইলে ভালো দেখানোর জন্য অতিরিক্ত সেফটি */
            -webkit-font-smoothing: antialiased;
        }
        .sticky-top-area {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: var(--bg-dark);
        }
        header {
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
        }
        .logo { font-size: 18px; font-weight: 800; color: #fff; }
        .server-switcher {
            display: flex; gap: 5px; background: #111; padding: 3px; border-radius: 50px;
        }
        .srv-btn {
            background: transparent; color: #666; border: none; padding: 5px 12px;
            border-radius: 50px; font-size: 11px; font-weight: 700; cursor: pointer;
        }
        .srv-btn.active { background: #fff; color: #000; }
        .info-slider {
            background: #ffffff; 
            color: #000;
            padding: 8px 0;
            font-size: 14px;
            font-weight: 700;
            overflow: hidden;
            white-space: nowrap;
            border-bottom: 3px solid #ff0000;
        }
        .info-content {
            display: inline-block;
            animation: scroll-left 65s linear infinite;
            padding-left: 100%;
        }
        @keyframes scroll-left {
            0% { transform: translateX(0); }
            100% { transform: translateX(-100%); }
        }
        .video-box {
            background: #000;
            aspect-ratio: 16/9;
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
        }
        .container { max-width: 1400px; margin: 0 auto; padding: 0 10px; }
        .search-box-container {
            padding: 10px 0;
        }
        #ch-search {
            width: 100%;
            padding: 10px 15px;
            background: #111;
            border: 1px solid #222;
            border-radius: 6px;
            color: #fff;
            font-family: 'Hind Siliguri', sans-serif;
            font-size: 14px;
            outline: none;
            box-sizing: border-box;
        }
        #ch-search:focus { border-color: #444; }
        .tabs { 
            display: flex; overflow-x: auto; gap: 8px; padding: 10px 0; 
            scrollbar-width: none; background: var(--bg-dark);
        }
        .tabs::-webkit-scrollbar { display: none; } /* Safari/Chrome */
        .tab {
            background: #141414; border: 1px solid #222; color: #888;
            padding: 8px 18px; border-radius: 4px; font-size: 11px; font-weight: 700;
            cursor: pointer; white-space: nowrap;
        }
        .tab.active { background: #fff; color: #000; border-color: #fff; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding-bottom: 40px; margin-top: 10px; }
        
        /* ল্যাপটপ বা বড় স্ক্রিনের জন্য গ্রিড অ্যাডজাস্টমেন্ট */
        @media (min-width: 768px) {
            .grid { grid-template-columns: repeat(6, 1fr); }
        }

        .item {
            background: var(--surface); border: 1px solid #1a1a1a; border-radius: 8px;
            padding: 10px 5px; text-align: center; height: 95px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer; transition: 0.2s;
        }
        .item.active { background: #fff; }
        .item.active .ch-name { color: #000; }
        .ch-name { font-size: 10px; font-weight: 700; color: #ccc; margin-top: 5px; }
        .ch-logo { width: 35px; height: 35px; object-fit: contain; }
    </style>
</head>
<body>
<div class="sticky-top-area">
    <header>
        <div class="logo">CCPLC <span style="font-weight: 300; opacity: 0.6;">CCTV</span></div>
        <div class="server-switcher">
            <button class="srv-btn" id="btn-srv-2" onclick="switchServer(2)">সার্ভার ২</button>
            <button class="srv-btn" id="btn-srv-1" onclick="switchServer(1)">সার্ভার ১</button>
        </div>
    </header>
    <div class="info-slider">
        <div class="info-content" id="sliding-info">তথ্য লোড হচ্ছে...</div>
    </div>
    <div class="video-box" id="player-container"></div>
</div>
<div class="container">
    <div class="search-box-container">
        <input type="text" id="ch-search" placeholder="চ্যানেলের নাম লিখে সার্চ করুন..." onkeyup="filterChannels()">
    </div>
    <div class="tabs" id="tabs-list"></div>
    <div class="grid" id="grid-list">অপেক্ষা করুন...</div>
</div>

<script src="https://vjs.zencdn.net/7.20.3/video.min.js"></script>
<script>
    let currentServer = 2;
    let tvPlayer = null;
    let masterData = {};
    let currentRandomQuote = "";
    let lastActiveCategory = "";
    
    const annualEvents = {
        "0-1": "শুভ ইংরেজি নববর্ষ! নতুন বছরের শুভেচ্ছা।",
        "0-10": "বঙ্গবন্ধুর স্বদেশ প্রত্যাবর্তন দিবস।",
        "1-14": "বিশ্ব ভালোবাসা দিবস।",
        "1-21": "মহান শহীদ দিবস ও আন্তর্জাতিক মাতৃভাষা দিবস। বিনম্র শ্রদ্ধা।",
        "2-8": "আন্তর্জাতিক নারী দিবস।",
        "2-17": "জাতীয় শিশু দিবস।",
        "2-26": "মহান স্বাধীনতা ও জাতীয় দিবস। বীর শহীদদের জানাই সালাম।",
        "3-14": "পহেলা বৈশাখ: বাংলা নববর্ষের অনেক অনেক শুভেচ্ছা।",
        "4-1": "মহান মে দিবস: বিশ্বজুড়ে শ্রমিকের অধিকার সুপ্রতিষ্ঠিত হোক।",
        "5-5": "বিশ্ব পরিবেশ দিবস: গাছ লাগান, পরিবেশ বাঁচান।",
        "7-15": "জাতীয় শোক দিবস।",
        "11-16": "মহান বিজয় দিবস। বিজয়ের গৌরবে গর্বিত বাংলাদেশ।",
        "11-25": "শুভ বড়দিন! শান্তি ও সম্প্রীতির উৎসব।"
    };

    const motivationalQuotes = ["সফলতা মানেই শেষ নয়, ব্যর্থতা মানেই মৃত্যু নয়; আসল হলো এগিয়ে যাওয়ার সাহস ধরে রাখা।"];

    function pickRandomQuote() {
        const randomIndex = Math.floor(Math.random() * motivationalQuotes.length);
        currentRandomQuote = motivationalQuotes[randomIndex];
    }

    function updateSlidingInfo() {
        const now = new Date();
        const month = now.getMonth();
        const date = now.getDate();
        const key = `${month}-${date}`;
        const dateStr = now.toLocaleDateString('bn-BD', { day: 'numeric', month: 'long', year: 'numeric' });
        const timeStr = now.toLocaleTimeString('bn-BD');
        const eventToday = annualEvents[key] ? ` | ✨ ${annualEvents[key]}` : "";
        const fullText = `📅 আজ ${dateStr} | 🕒 সময়: ${timeStr}${eventToday} | 💡 মো티브েশন: ${currentRandomQuote}`;
        document.getElementById('sliding-info').innerHTML = `${fullText} &nbsp;&nbsp;&nbsp;&nbsp;&nbsp; [ ${fullText} ]`;
    }

    setInterval(pickRandomQuote, 300000);
    setInterval(updateSlidingInfo, 1000);

    const excludeKeywords = [''];
    const manualChannels = [
        { name: "T-Sports HD", url: "https://bongoflixbd.top/r/?watch=b0aeb53ec98c74b3b1bb5f16acf8f056", logo: "https://upload.wikimedia.org/wikipedia/en/2/2f/T_Sports_logo.png", category: "SPORTS", isIframe: true },
        { name: "Star Sports 1", url: "https://bongoflixbd.top/r/?watch=339dcfaa4f761b545a5b815ee54a9bad", logo: "🏏", category: "SPORTS", isIframe: true }
    ];

    const M3U_DISH = 'https://raw.githubusercontent.com/alex8875/m3u/refs/heads/main/dishtv.m3u';
    const M3U_MAIN = 'https://raw.githubusercontent.com/sm-monirulislam/SM-Live-TV/refs/heads/main/RoarZone.m3u';
    const M3U_BD = 'https://raw.githubusercontent.com/cctvccplc/Tv-Test/refs/heads/main/BD26.m3u8';

    window.onload = () => {
        pickRandomQuote();
        updateSlidingInfo();
        switchServer(2);
    };

    async function switchServer(id) {
        currentServer = id;
        document.querySelectorAll('.srv-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(`btn-srv-${id}`).classList.add('active');
        document.getElementById('ch-search').value = "";
        masterData = {}; 
        if (tvPlayer && tvPlayer.dispose) { try{ tvPlayer.dispose(); } catch(e){} }
        const pContainer = document.getElementById('player-container');
        pContainer.innerHTML = '';

        if (id === 1) {
            pContainer.innerHTML = `<video id="shaka-player" controls autoplay style="width:100%; height:100%;"></video>`;
            tvPlayer = new shaka.Player(document.getElementById('shaka-player'));
            await loadM3U(M3U_DISH);
        } else {
            manualChannels.forEach(ch => addChannel(ch.category, ch));
            pContainer.innerHTML = `<video id="vjs-player" class="video-js vjs-big-play-centered" controls playsinline style="width:100%; height:100%;"></video><iframe id="iframe-player" style="display:none; width:100%; height:100%; border:none;" allowfullscreen></iframe>`;
            tvPlayer = videojs('vjs-player', { fluid: true });
            await loadServer2();
        }
    }

    async function loadM3U(url) {
        try {
            const res = await fetch(url);
            const text = await res.text();
            const lines = text.split('\n');
            let currentDRM = null;
            for (let i = 0; i < lines.length; i++) {
                let line = lines[i].trim();
                if (line.includes('license_key=')) {
                    let p = line.split('=')[1].split(':');
                    currentDRM = { [p[0].trim()]: p[1].trim() };
                } else if (line.startsWith('#EXTINF:')) {
                    let name = line.split(',')[1]?.trim() || "";
                    if (excludeKeywords.some(k => name.toLowerCase().includes(k))) continue;
                    let logo = line.match(/tvg-logo="([^"]+)"/)?.[1] || "";
                    let group = line.match(/group-title="([^"]+)"/)?.[1]?.toUpperCase() || "OTHERS";
                    let chUrl = lines[i+1]?.trim();
                    if (chUrl && chUrl.startsWith('http')) {
                        addChannel(group, { name, logo, url: chUrl, drm: currentDRM });
                    }
                    currentDRM = null;
                }
            }
            renderTabs();
        } catch(e) {}
    }

    async function loadServer2() {
        try {
            const [r1, r2] = await Promise.all([
                fetch(M3U_MAIN).then(r=>r.text()).catch(()=>""), 
                fetch(M3U_BD).then(r=>r.text()).catch(()=>"")
            ]);
            parseS2(r1, false); parseS2(r2, true);
            renderTabs();
        } catch(e) {}
    }

    function parseS2(data, isBd) {
        const lines = data.split('\n');
        let temp = null;
        lines.forEach(l => {
            if (l.includes('#EXTINF:')) {
                let name = l.split(',')[1]?.trim() || "";
                if (!isBd && excludeKeywords.some(k => name.toLowerCase().includes(k))) { temp = null; return; }
                temp = { name, logo: l.match(/tvg-logo="([^"]+)"/)?.[1], category: isBd ? "BANGLA" : (l.match(/group-title="([^"]+)"/)?.[1]?.toUpperCase() || "OTHERS") };
            } else if (l.startsWith('http') && temp) {
                temp.url = l.trim();
                temp.isIframe = temp.url.includes('bongoflix');
                addChannel(temp.category, temp);
                temp = null;
            }
        });
    }

    function addChannel(cat, ch) {
        if (!masterData[cat]) masterData[cat] = [];
        masterData[cat].push(ch);
    }

    function renderTabs() {
        const cats = Object.keys(masterData).sort();
        document.getElementById('tabs-list').innerHTML = cats.map(c => `<button class="tab" onclick="loadCategory('${c}')" id="tab-${c}">${c}</button>`).join('');
        if (cats.length > 0) loadCategory(cats.includes('SPORTS') ? 'SPORTS' : cats[0]);
    }

    function loadCategory(cat) {
        lastActiveCategory = cat;
        document.getElementById('ch-search').value = "";
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        const activeTab = document.getElementById(`tab-${cat}`);
        if(activeTab) activeTab.classList.add('active');
        renderGrid(masterData[cat] || []);
    }

    function renderGrid(list) {
        const grid = document.getElementById('grid-list');
        grid.innerHTML = list.map(ch => {
            let img = (ch.logo && ch.logo.startsWith('http')) ? `<img class="ch-logo" src="${ch.logo}">` : `📺`;
            return `<div class="item" onclick='playChannel(${JSON.stringify(ch)}, this)'>${img}<div class="ch-name">${ch.name}</div></div>`;
        }).join('');
    }

    function filterChannels() {
        const query = document.getElementById('ch-search').value.toLowerCase();
        if (query === "") {
            renderGrid(masterData[lastActiveCategory] || []);
        } else {
            let filtered = [];
            Object.keys(masterData).forEach(cat => {
                masterData[cat].forEach(ch => {
                    if (ch.name.toLowerCase().includes(query)) filtered.push(ch);
                });
            });
            renderGrid(filtered);
        }
    }

    function playChannel(ch, el) {
        document.querySelectorAll('.item').forEach(i => i.classList.remove('active'));
        el.classList.add('active');
        if (currentServer === 1) {
            tvPlayer.configure({ drm: { clearKeys: ch.drm || {} } });
            tvPlayer.load(ch.url);
        } else {
            const v = document.getElementById('vjs-player'), f = document.getElementById('iframe-player');
            if (ch.isIframe) { 
                if(tvPlayer && tvPlayer.pause) tvPlayer.pause(); 
                v.style.display = 'none'; f.style.display = 'block'; f.src = ch.url; 
            } else { 
                f.style.display = 'none'; v.style.display = 'block'; 
                tvPlayer.src({ src: ch.url, type: 'application/x-mpegURL' }); 
                tvPlayer.play(); 
            }
        }
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }
</script>
</body>
</html>
