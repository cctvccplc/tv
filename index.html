<script src="https://vjs.zencdn.net/7.20.3/video.min.js"></script>
<script>
    let vPlayer;
    const m3uUrl = 'https://raw.githubusercontent.com/cctvccplc/Tv-Test/refs/heads/main/BD26.m3u8';

    document.addEventListener("DOMContentLoaded", function() {
        vPlayer = videojs('vjsPlayer');
        loadM3U();
    });

    function switchPage(pageId, btn) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(pageId).classList.add('active');
        btn.classList.add('active');
        
        const iframe = document.getElementById('iframePlayer');
        if(pageId === 'page1') {
            vPlayer.pause(); 
        } else {
            const currentSrc = iframe.src;
            iframe.src = ""; 
            iframe.src = currentSrc; 
        }
    }

    function playIframe(url, el) {
        document.getElementById('iframePlayer').src = url;
        document.querySelectorAll('#page1 .channel-item').forEach(i => i.classList.remove('active'));
        el.classList.add('active');
    }

    async function loadM3U() {
        const listContainer = document.getElementById('m3u-list');
        try {
            const response = await fetch(m3uUrl);
            const data = await response.text();
            const lines = data.split('\n');
            listContainer.innerHTML = "";

            for (let i = 0; i < lines.length; i++) {
                if (lines[i].startsWith('#EXTINF:')) {
                    let info = lines[i].split(',');
                    let rawName = info[1] || "Unknown Channel";
                    let cleanName = rawName.split('KODIPROP')[0].split('inputstream')[0].split(':')[0].trim();
                    const streamUrl = lines[i + 1]?.trim();

                    if (streamUrl && streamUrl.startsWith('http')) {
                        const div = document.createElement('div');
                        div.className = 'channel-item';
                        div.innerHTML = `<span>📡</span><b>${cleanName}</b>`;
                        div.onclick = () => {
                            document.querySelectorAll('#page2 .channel-item').forEach(item => item.classList.remove('active'));
                            div.classList.add('active');
                            vPlayer.src({ src: streamUrl, type: 'application/x-mpegURL' });
                            vPlayer.play();
                        };
                        listContainer.appendChild(div);
                    }
                }
            }
        } catch (error) {
            listContainer.innerHTML = "<p style='color:red; grid-column: span 4;'>চ্যানেল লোড করা সম্ভব হয়নি।</p>";
        }
    }

    function toBanglaNum(num) {
        const banglaNums = {'0':'০','1':'১','2':'২','3':'৩','4':'৪','5':'৫','6':'৬','7':'৭','8':'৮','9':'৯'};
        return num.toString().replace(/[0-9]/g, s => banglaNums[s]);
    }

    function updateClock() {
        const now = new Date();
        
        // সময়
        let hours = now.getHours();
        let minutes = now.getMinutes();
        let seconds = now.getSeconds();
        let ampm = hours >= 12 ? 'পিএম' : 'এএম';
        hours = hours % 12 || 12;
        
        const timeStr = toBanglaNum(hours.toString().padStart(2, '0')) + ":" + 
                        toBanglaNum(minutes.toString().padStart(2, '0')) + ":" + 
                        toBanglaNum(seconds.toString().padStart(2, '0')) + " " + ampm;
        
        // বার এবং তারিখ (বাংলা)
        const dayOptions = { weekday: 'long' };
        const dateOptions = { day: 'numeric', month: 'long', year: 'numeric' };
        
        const dayName = now.toLocaleDateString('bn-BD', dayOptions);
        const dateStr = now.toLocaleDateString('bn-BD', dateOptions);
        
        document.getElementById('clock').innerText = timeStr;
        document.getElementById('date').innerText = dayName + ", " + dateStr;
    }
    
    setInterval(updateClock, 1000);
    updateClock();
</script>
